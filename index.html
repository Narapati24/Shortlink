<!DOCTYPE html>
<html lang="en" class="scroll-smooth antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/img/logo/RainyDeepLogo.png" />
    <link rel="apple-touch-icon" href="/img/logo/RainyDeepLogo.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Primary SEO -->
    <title>
      Narapati Keysa Anandi | Full-Stack Web & Mobile Developer - Bangkit
      Academy Graduate
    </title>
    <meta
      name="title"
      content="Narapati Keysa Anandi | Full-Stack Web & Mobile Developer - Bangkit Academy Graduate"
    />
    <meta
      name="description"
      content="Portfolio of Narapati Keysa Anandi, a Full-Stack Web & Mobile Developer and Bangkit Academy Graduate. Specializing in Flutter, Kotlin, Laravel, and AI-powered implementations."
    />
    <meta
      name="keywords"
      content="Narapati Keysa Anandi, Full-Stack Developer, Mobile Developer, Web Developer, Bangkit Academy, Flutter, Kotlin, Laravel, Software Engineer, Portfolio, Kodingin.id"
    />
    <meta name="author" content="Narapati Keysa Anandi" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://narapatis.my.id/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://narapatis.my.id/" />
    <meta
      property="og:title"
      content="Narapati Keysa Anandi | Full-Stack Web & Mobile Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Narapati Keysa Anandi, Bangkit Academy Graduate and Full-Stack Developer specializing in modern web and mobile applications."
    />
    <meta
      property="og:image"
      content="https://narapatis.my.id/img/profile/profile.JPG"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://narapatis.my.id/" />
    <meta
      property="twitter:title"
      content="Narapati Keysa Anandi | Full-Stack Web & Mobile Developer"
    />
    <meta
      property="twitter:description"
      content="Explore the portfolio of Narapati Keysa Anandi, a skilled Full-Stack Developer & Bangkit Academy Alumni."
    />
    <meta
      property="twitter:image"
      content="https://narapatis.my.id/img/profile/profile.JPG"
    />

    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body
    class="bg-[#0B1120] text-slate-100 selection:bg-violet-500 selection:text-white min-h-screen"
  >
    <!-- Top Bar -->
    <header class="sticky top-0 z-30 bg-[#0B1120] border-b border-slate-800/80">
      <div
        class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 h-14 flex items-center justify-between"
      >
        <a
          href="#"
          class="font-semibold tracking-tight text-sm sm:text-base flex items-center gap-2 text-slate-100"
        >
          <span
            class="w-2 h-2 rounded-full bg-violet-400"
            aria-hidden="true"
          ></span>
          <span>narapatis.my.id</span>
        </a>
        <a
          href="#projects"
          class="text-xs sm:text-sm font-medium text-slate-300 hover:text-violet-300 px-3 py-1.5 rounded-lg transition-colors"
        >
          Projects
        </a>
      </div>
    </header>

    <main
      class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 py-8 sm:py-12 lg:grid lg:grid-cols-12 lg:gap-10 space-y-12 lg:space-y-0"
    >
      <!-- Profile / Hero Section -->
      <aside
        aria-label="Profile"
        class="space-y-6 lg:col-span-3 lg:sticky lg:top-20 lg:self-start"
      >
        <div class="flex flex-col sm:flex-row sm:items-center gap-5">
          <img
            id="profile-image"
            src="/img/profile/profile.JPG"
            alt="Narapati Keysa Anandi"
            width="88"
            height="88"
            class="w-20 h-20 sm:w-22 sm:h-22 rounded-2xl object-cover border border-violet-500/30 shrink-0 bg-slate-800"
          />
          <div class="space-y-1.5">
            <h1
              id="profile-name"
              class="text-2xl sm:text-3xl font-bold tracking-tight text-white"
            >
              Narapati Keysa Anandi
            </h1>
            <p
              id="profile-role"
              class="text-sm sm:text-base font-medium text-violet-300"
            >
              Full-Stack Developer | Mobile App Specialist
            </p>
          </div>
        </div>

        <p
          id="profile-desc"
          class="text-sm sm:text-base leading-relaxed text-slate-300 max-w-2xl"
        ></p>

        <!-- Social & Quick Links -->
        <div id="social-links" class="flex flex-wrap gap-2"></div>

        <!-- Core Skills -->
        <div class="pt-2">
          <h2
            class="text-xs font-mono uppercase tracking-wider text-slate-400 mb-3"
          >
            Core Stack
          </h2>
          <div id="skills-list" class="flex flex-wrap gap-1.5"></div>
        </div>
      </aside>

      <hr class="border-slate-800/80 lg:hidden" />

      <!-- Projects Section -->
      <section
        id="projects"
        aria-label="Projects"
        class="space-y-5 lg:col-span-9"
      >
        <div
          class="flex flex-col sm:flex-row sm:items-end justify-between gap-4"
        >
          <div>
            <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white">
              Selected Projects
            </h2>
            <p class="text-sm text-slate-400 mt-0.5">
              Mobile apps, web platforms, and interactive builds.
            </p>
          </div>

          <!-- Search & Year Filter -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <div class="relative flex-1 sm:w-56">
              <svg
                class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <input
                id="project-search"
                type="search"
                placeholder="Search projects..."
                class="w-full pl-9 pr-3 py-2 text-sm bg-[#131C31] text-slate-100 placeholder:text-slate-500 border border-slate-800 rounded-xl focus:outline-none focus:border-violet-500 transition-colors"
              />
            </div>

            <select
              id="year-filter"
              aria-label="Filter projects by year"
              class="px-3 py-2 text-sm bg-[#131C31] text-slate-200 border border-slate-800 rounded-xl focus:outline-none focus:border-violet-500 transition-colors"
            ></select>
          </div>
        </div>

        <!-- Category Filter Tabs -->
        <div
          id="filter-tabs"
          class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar"
          role="tablist"
          aria-label="Filter projects by category"
        ></div>

        <!-- Projects Grid -->
        <div
          id="projects-grid"
          class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5"
        ></div>

        <!-- Empty State -->
        <div
          id="empty-state"
          class="hidden py-12 text-center border border-dashed border-slate-800 rounded-2xl bg-[#131C31]/40"
        >
          <p class="text-sm text-slate-400">
            No projects match your filter.
          </p>
          <button
            id="reset-filters"
            type="button"
            class="mt-3 text-xs font-medium underline underline-offset-4 text-violet-300 hover:text-violet-200"
          >
            Reset filters
          </button>
        </div>

        <!-- Pagination -->
        <nav
          id="pagination"
          aria-label="Projects pagination"
          class="flex items-center justify-between pt-2"
        ></nav>
      </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 mt-16 py-8">
      <div
        class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400"
      >
        <p>© <span id="footer-year"></span> Narapati Keysa Anandi.</p>
        <a
          href="#"
          class="hover:text-violet-300 transition-colors"
        >
          Back to top ↑
        </a>
      </div>
    </footer>

    <!-- Project Detail Modal -->
    <dialog
      id="project-modal"
      class="w-[calc(100%-2rem)] max-w-xl rounded-2xl bg-[#131C31] text-slate-100 border border-slate-700/80 p-0 shadow-2xl backdrop:bg-black/75"
    >
      <div id="modal-content" class="p-5 sm:p-6 space-y-4"></div>
    </dialog>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
